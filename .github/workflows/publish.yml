# Publishes `fjl` to npm when a GitHub Release is created for an `fjl@*` tag.
# See md/RELEASING.md.

name: Publish

on:
  release:
    types: [created]

jobs:
  build-test-publish-to-npm:
    # Releases for sibling package tags (e.g., `fjl-validator@*`) must not publish `fjl`.
    if: startsWith(github.event.release.tag_name, 'fjl@')
    runs-on: ubuntu-latest
    env:
      NODE_ENV: CI/CD
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'
      - run: pnpm i
      - run: pnpm build
      - run: pnpm test
      # npm 11 refuses to publish a prerelease without an explicit dist-tag.
      - name: Publish to npm
        working-directory: packages/fjl
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
